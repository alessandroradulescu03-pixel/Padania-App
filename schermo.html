<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PadaniaTuning · Schermo live</title>
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--card:rgba(22,22,26,.78);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f2f3f5;--muted:#8b8d94;--dim:#5d5f66;--silver:#d7dade;
  --chrome:linear-gradient(180deg,#ffffff 0%,#d3d7dc 45%,#8f959c 52%,#e9ecef 100%);
  --ok:#34d27b;--ok2:#7cf0ad;--wait:#f5a524;--bad:#ff5a52;--blue:#7aa7ff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Barlow",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
body.idle{cursor:none}
.d{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em}

/* sfondo: bagliore + linee di velocità */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 50% at 18% 0%,rgba(52,210,123,.10),transparent 70%),
    radial-gradient(50% 50% at 100% 100%,rgba(215,218,222,.07),transparent 70%),
    var(--bg)}
.bg:before{content:"";position:absolute;inset:-50%;opacity:.35;
  background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.025) 46px 48px);
  animation:drift 40s linear infinite}
@keyframes drift{to{transform:translateX(96px)}}
.flag{position:fixed;left:0;right:0;top:0;height:.7vh;z-index:5;
  background:repeating-conic-gradient(#e9ecef 0 25%,#111 0 50%) 0 0/1.4vh 1.4vh;opacity:.85}

.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2.2vh;padding:3.4vh 3vw 2.4vh}
header{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{display:flex;align-items:center;gap:1.4vw;min-width:0}
.brand img{height:9.5vh;width:9.5vh;border-radius:24%;box-shadow:0 0 0 1px var(--line2),0 1.4vh 4vh rgba(0,0,0,.6)}
.brand h1{font-size:6vh;line-height:.95;font-style:italic;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--muted);font-size:2.2vh;margin-top:.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:2vw}
.clock{font-family:var(--display);font-weight:700;font-size:7vh;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{font-size:3.4vh;color:var(--dim);margin-left:.3vw}
.live{display:inline-flex;align-items:center;gap:.7vw;font-weight:800;font-size:2.1vh;letter-spacing:.2vh;padding:1vh 1.4vw;border-radius:99px;background:rgba(52,210,123,.12);color:var(--ok);border:1px solid rgba(52,210,123,.3)}
.live:before{content:"";width:1.2vh;height:1.2vh;border-radius:50%;background:currentColor;box-shadow:0 0 1.4vh currentColor;animation:pulse 1.6s infinite}
.live.off{background:rgba(255,90,82,.12);color:var(--bad);border-color:rgba(255,90,82,.3)}
@keyframes pulse{50%{opacity:.25}}

main{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr auto;gap:2.2vh 1.6vw;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:2.6vh;padding:2.8vh 2vw;min-height:0;position:relative;overflow:hidden;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2vh 5vh rgba(0,0,0,.35)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.lbl{font-size:1.9vh;font-weight:700;letter-spacing:.3vh;color:var(--muted);text-transform:uppercase}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2vw;background:linear-gradient(150deg,rgba(30,32,36,.9),rgba(14,14,17,.9))}
.hero-main{display:flex;flex-direction:column;justify-content:center;min-width:0}
.big{font-family:var(--display);font-weight:800;font-size:31vh;line-height:.82;margin:1vh 0 1.4vh;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--ok2),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 4vh rgba(52,210,123,.25));transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.big.bump{transform:scale(1.06)}
.sub{font-size:2.8vh;color:var(--muted)}
.sub b{color:var(--text);font-weight:700}
.sub .o{color:var(--blue)}
.ring{--p:0;--c:var(--ok);width:34vh;height:34vh;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.06) 0);transition:--p .6s}
.ring:before{content:"";position:absolute;inset:2.4vh;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1d1e22,#101013)}
.ring div{position:relative;text-align:center}
.ring b{display:block;font-family:var(--display);font-weight:800;font-size:9vh;line-height:1}
.ring span{font-size:1.9vh;font-weight:700;letter-spacing:.3vh;color:var(--muted);text-transform:uppercase}
.ring em{display:block;font-style:normal;font-size:2.3vh;color:var(--muted);margin-top:.6vh}
.capmsg{margin-top:2vh;display:inline-flex;align-items:center;gap:.8vw;font-size:2.6vh;font-weight:700;padding:1vh 1.4vw;border-radius:1.4vh;width:max-content}
.capmsg.l1{color:var(--wait);background:rgba(245,165,36,.12)}
.capmsg.l2{color:#ff8a3d;background:rgba(255,138,61,.14)}
.capmsg.l3{color:var(--bad);background:rgba(255,90,82,.14);animation:pulse 1.4s infinite}

/* colonna destra */
.side{display:grid;grid-template-rows:auto 1fr;gap:2.2vh;min-height:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}
.num b{display:block;font-family:var(--display);font-weight:800;font-size:9.5vh;line-height:1;margin-top:.8vh;font-variant-numeric:tabular-nums}
.num.w b{color:var(--wait)}
.num .mini{height:.8vh;border-radius:99px;background:rgba(255,255,255,.07);margin-top:1.4vh;overflow:hidden}
.num .mini i{display:block;height:100%;width:0;border-radius:99px;background:var(--chrome);transition:width .6s}
.arrivals{display:flex;flex-direction:column}
.recent{list-style:none;margin-top:1.4vh;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1vh;
  -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
.recent li{display:flex;align-items:center;gap:1.2vw;padding:1.1vh 1vw;border-radius:1.6vh;background:rgba(255,255,255,.035);border:1px solid var(--line);animation:in .6s cubic-bezier(.2,1,.3,1)}
.recent li.new{background:rgba(52,210,123,.12);border-color:rgba(52,210,123,.35)}
.av{flex:0 0 6vh;height:6vh;border-radius:1.6vh;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.8vh;background:rgba(255,255,255,.06);color:var(--silver);border:1px solid var(--line2)}
.recent li.new .av{color:var(--ok);border-color:rgba(52,210,123,.4)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:2.9vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:1.9vh;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent time{font-family:var(--display);font-weight:700;font-size:3.2vh;color:var(--ok);font-variant-numeric:tabular-nums}
@keyframes in{from{opacity:0;transform:translateY(-1.6vh) scale(.98)}}
.empty{color:var(--dim);font-size:2.4vh;padding:2vh 0}

/* grafico */
.chart-card{grid-column:1/-1;padding-bottom:2vh}
.chart-head{display:flex;justify-content:space-between;align-items:baseline}
.chart-head span{font-size:2vh;color:var(--muted)}
.chart-head b{color:var(--text)}
.chart{display:flex;align-items:flex-end;gap:.5vw;height:15vh;margin-top:1.6vh}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.6vh;min-width:0}
.chart .v{font-size:1.6vh;font-weight:700;color:var(--muted);min-height:1.8vh}
.chart .b{width:100%;max-width:4.6vw;min-height:.5vh;border-radius:1vh 1vh .3vh .3vh;background:linear-gradient(180deg,#eef0f2,#6f747b);transition:height .6s}
.chart .b.z{background:rgba(255,255,255,.06)}
.chart .b.p{background:linear-gradient(180deg,var(--ok2),var(--ok));box-shadow:0 0 2.4vh rgba(52,210,123,.35)}
.chart .l{font-size:1.5vh;color:var(--dim);white-space:nowrap;min-height:1.8vh}

footer{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:1.8vh}
footer button{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:99px;padding:.7vh 1.4vw;font:inherit;cursor:pointer}

/* benvenuto */
.welcome{position:fixed;left:50%;bottom:6vh;transform:translate(-50%,3vh);opacity:0;z-index:8;pointer-events:none;
  display:flex;align-items:center;gap:1.4vw;padding:2vh 3vw;border-radius:2.4vh;
  background:linear-gradient(135deg,rgba(28,30,34,.96),rgba(14,14,17,.96));border:1px solid rgba(52,210,123,.45);
  box-shadow:0 3vh 8vh rgba(0,0,0,.7),0 0 6vh rgba(52,210,123,.18);transition:opacity .4s,transform .5s cubic-bezier(.2,1.4,.4,1)}
.welcome.show{opacity:1;transform:translate(-50%,0)}
.welcome .fl{font-size:6vh}
.welcome span{display:block;font-size:2.2vh;color:var(--muted);font-weight:700;letter-spacing:.3vh;text-transform:uppercase}
.welcome b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:6vh;line-height:1;text-transform:uppercase;
  background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

@media (orientation:portrait){
  body{overflow:auto}
  .wrap{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:none}
  .hero{grid-template-columns:1fr}
  .ring{width:26vh;height:26vh;justify-self:center}
  .big{font-size:20vh}
  .chart-card{grid-column:auto}
  .recent{max-height:50vh}
}

/* login */
#login[hidden]{display:none}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9;padding:24px}
#login form{width:100%;max-width:340px;text-align:center}
#login img{width:110px;border-radius:26px;margin-bottom:18px}
#login h2{font-size:34px;margin-bottom:8px}
#login p{color:var(--muted);margin-bottom:18px;font-size:15px}
#login input{width:100%;padding:15px;border-radius:12px;border:1px solid #34343a;background:#111113;color:var(--text);font-size:16px;text-align:center;margin-bottom:12px;outline:0}
#login button{width:100%;padding:15px;border-radius:12px;border:0;background:var(--chrome);color:#111;font-weight:800;font-size:16px;cursor:pointer}
#login .err{color:var(--bad);min-height:20px;margin-top:10px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flag"></div>

<div id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <img src="./assets/logo.png" alt="">
    <h2 class="d">Schermo live</h2>
    <p>Password dello staff per collegare lo schermo.</p>
    <input type="password" id="pw" placeholder="Password">
    <button type="submit">Collega</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <img src="./assets/logo.png" alt="">
      <div><h1 class="d">Padania Tuning</h1><p id="evName">Ingressi in tempo reale</p></div>
    </div>
    <div class="right"><span class="live" id="live">LIVE</span><span class="clock" id="clock">--:--</span></div>
  </header>

  <main>
    <section class="card hero">
      <div class="hero-main">
        <div class="lbl">Dentro ora</div>
        <div class="big" id="inside">0</div>
        <div class="sub"><b id="entered">0</b> entrati in totale<span id="outWrap"> · <b class="o" id="out">0</b> usciti</span></div>
        <div class="capmsg" id="capMsg" hidden></div>
      </div>
      <div class="ring" id="ring"><div><span id="ringLbl">Arrivati</span><b id="ringVal">0%</b><em id="ringSub"></em></div></div>
    </section>

    <section class="side">
      <div class="card nums">
        <div class="num"><div class="lbl">Iscritti</div><b id="tot">0</b></div>
        <div class="num w"><div class="lbl">Attesi</div><b id="wait">0</b></div>
        <div class="num"><div class="lbl">Arrivati</div><b id="pct">0%</b><div class="mini"><i id="pctBar"></i></div></div>
      </div>
      <div class="card arrivals">
        <div class="lbl">Ultimi arrivi</div>
        <ul class="recent" id="recent"></ul>
      </div>
    </section>

    <section class="card chart-card">
      <div class="chart-head"><div class="lbl">Ingressi ogni 15 minuti</div><span id="peak"></span></div>
      <div class="chart" id="chart"></div>
    </section>
  </main>

  <footer><span id="upd">In attesa dei dati…</span><button id="fs">⛶ Schermo intero</button></footer>
</div>

<div class="welcome" id="welcome"><div class="fl">🏁</div><div><span>Benvenuto</span><b id="welName"></b></div></div>

<script>
/* Schermo live: legge gli stessi dati dell'app check-in (script Google) e si aggiorna da solo.
   Parametri opzionali nell'indirizzo: ?cap=100 (capienza)  ·  ?nomi=0 (nasconde i nomi) */
const PW_HASH = '3fc13c35bdb2d6f9146fcd93304ba3c2143d5d017268e17a939f0d315728c8a2';
const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweHwQuH_P4cblhQDbDnI6Ri86qSEqwWyMSCgTRZJ3yFjr5KV_0Q8NpHRUUOVoqZTrjug/exec';
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const load = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const settings = load('pt4_settings', {});
const URL_ = settings.url || DEFAULT_SCRIPT_URL;
const CAP = +params.get('cap') || +settings.capacity || 0;
const SHOW_NAMES = params.get('nomi') !== '0';
let key = ''; try { key = localStorage.getItem('pt4_key') || ''; } catch {}
let recs = {}, names = {}, subs = {}, total = 0, listAt = 0, rev = '', lastInside = -1, ok = false, lastOk = 0;
let seenMoves = null;

const pad = n => String(n).padStart(2, '0');
const fmt = t => new Date(t).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const compact = s => norm(s).replace(/[\s\-.]/g, '');
function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
const initials = n => { const w = String(n).split(/\s+/).filter(Boolean); return ((w[0]?.[0] || '') + (w[1]?.[0] || '')).toUpperCase() || '✓'; };

/* stesse regole dell'app per riconoscere le persone (così abbiamo i nomi anche dei vecchi check-in) */
function columns(headers) {
  const h = headers.map(norm), find = re => h.findIndex(x => re.test(x));
  let nome = h.findIndex(x => /^(nome|name|first ?name)\b/.test(x) && !/cognome/.test(x));
  let cognome = find(/(cognome|surname|last ?name)/);
  const full = find(/(nominativo|nome e cognome|nome completo|full ?name)/);
  if (full >= 0 && nome < 0) { nome = full; cognome = -1; }
  if (nome < 0 && cognome < 0) { nome = 0; cognome = headers.length > 1 ? 1 : -1; }
  if (nome < 0) { nome = cognome; cognome = -1; }
  const cat = find(/^(stato|status|categoria|tipo|pass|ticket|biglietto)$/);
  const id = find(/^(id|codice|code|n\.? ?iscrizione|numero iscrizione)$/);
  let k = [];
  if (id >= 0) k = [id];
  else {
    k = [...new Set([nome, cognome, find(/^e-?mail/), find(/(telefono|cellulare|phone)/), find(/^targa ?1?$/)].filter(i => i >= 0))];
    if (k.length < 2) k = headers.map((_, i) => i).filter(i => i !== cat);
  }
  return { nome, cognome, key: k, veh: find(/^veicolo ?1?$/) };
}
function indexList(headers, raw) {
  headers = headers.map(x => String(x ?? '').trim());
  const width = Math.max(headers.length, ...raw.map(r => r.length));
  while (headers.length < width) headers.push('Colonna ' + (headers.length + 1));
  const cols = columns(headers), seen = {};
  names = {}; subs = {}; total = 0;
  raw.forEach(r => {
    const c = headers.map((_, j) => String(r[j] ?? '').trim());
    if (!c.some(Boolean)) return;
    total++;
    let k = 'p' + hash(cols.key.map(i => compact(c[i])).join('␟'));
    seen[k] = (seen[k] || 0) + 1;
    if (seen[k] > 1) k += '-' + seen[k];
    names[k] = [c[cols.nome], cols.cognome >= 0 ? c[cols.cognome] : ''].join(' ').trim();
    if (cols.veh >= 0) subs[k] = c[cols.veh];
  });
}
const nameOf = (k, r) => names[k] || r.nm || r.a?.name || 'Partecipante';

async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function api(body) {
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch(URL_, { method: 'POST', redirect: 'follow', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key }) });
    const d = await r.json();
    if (d.auth === false) { showLogin('Password non accettata dallo script'); throw new Error('auth'); }
    if (!d.ok) throw new Error(d.error);
    return d;
  } finally { clearTimeout(tm); }
}

function showLogin(msg) { $('#login').hidden = false; $('#err').textContent = msg || ''; setTimeout(() => $('#pw').focus(), 200); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('#pw').value;
  let good = false; try { good = (await sha256(v)) === PW_HASH; } catch { $('#err').textContent = 'Apri la pagina dal link https'; return; }
  if (!good) { $('#err').textContent = 'Password errata'; return; }
  key = v; try { localStorage.setItem('pt4_key', v); } catch {}
  $('#login').hidden = true; tick(true);
});

async function tick(full) {
  try {
    if (full || Date.now() - listAt > 5 * 60000) {
      const l = await api({ action: 'list' });
      indexList(l.headers || [], l.rows || []);
      if (l.name) $('#evName').textContent = l.name + ' · ingressi in tempo reale';
      listAt = Date.now(); rev = '';
    }
    const s = await api({ action: 'sync', ops: [], rev });
    if (s.rev) rev = s.rev;
    if (!s.same) recs = s.recs || {};
    ok = true; lastOk = Date.now();
    render();
  } catch (e) { console.error(e); ok = false; }
  $('#live').className = 'live' + (ok ? '' : ' off');
  $('#live').textContent = ok ? 'LIVE' : 'OFFLINE';
}

function render() {
  const keys = Object.keys(recs);
  const added = keys.filter(k => k.startsWith('add-')).length;
  const tot = total + added;
  const entered = keys.filter(k => recs[k].t), inside = entered.filter(k => !recs[k].o).length, out = entered.length - inside;
  const pct = tot ? Math.round(entered.length / tot * 100) : 0;
  const set = (id, v) => { $(id).textContent = v; };
  set('#inside', inside); set('#entered', entered.length); set('#out', out); $('#outWrap').hidden = !out;
  set('#tot', tot); set('#wait', Math.max(0, tot - entered.length)); set('#pct', pct + '%');
  $('#pctBar').style.width = pct + '%';
  if (lastInside >= 0 && inside !== lastInside) { const b = $('#inside'); b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 350); }
  lastInside = inside;

  // anello: capienza se impostata, altrimenti % arrivati
  const ring = $('#ring');
  if (CAP) {
    const p = inside / CAP, lvl = p >= 1 ? 3 : p >= 0.9 ? 2 : p >= 0.75 ? 1 : 0;
    ring.style.setProperty('--p', Math.min(100, Math.round(p * 100)));
    ring.style.setProperty('--c', ['var(--silver)', 'var(--wait)', '#ff8a3d', 'var(--bad)'][lvl]);
    set('#ringLbl', 'Capienza'); set('#ringVal', `${inside}/${CAP}`); set('#ringSub', lvl === 3 ? 'piena' : `${Math.max(0, CAP - inside)} posti liberi`);
    $('#capMsg').hidden = !lvl; $('#capMsg').className = 'capmsg l' + lvl;
    $('#capMsg').textContent = ['', '⚠️ Quasi al completo', `🟠 Ultimi posti: ne restano ${Math.max(0, CAP - inside)}`, '⛔ Capienza raggiunta'][lvl];
  } else {
    ring.style.setProperty('--p', pct); ring.style.setProperty('--c', 'var(--ok)');
    set('#ringLbl', 'Arrivati'); set('#ringVal', pct + '%'); set('#ringSub', `${entered.length} su ${tot}`);
  }

  // ultimi arrivi + benvenuto per chi è appena entrato
  const moves = [];
  keys.forEach(k => (recs[k].l || []).forEach(e => { if (e[1] === 'i') moves.push({ k, t: e[0], id: k + e[0] }); }));
  moves.sort((a, b) => b.t - a.t);
  const fresh = seenMoves ? moves.filter(m => !seenMoves.has(m.id) && Date.now() - m.t < 120000) : [];
  seenMoves = new Set(moves.map(m => m.id));
  const show = moves.slice(0, 6);
  $('#recent').innerHTML = show.length
    ? show.map((m, i) => {
        const nm = SHOW_NAMES ? nameOf(m.k, recs[m.k]) : 'Nuovo ingresso';
        const sub = SHOW_NAMES ? (recs[m.k].v || subs[m.k] || '') : '';
        return `<li class="${i === 0 && Date.now() - m.t < 60000 ? 'new' : ''}"><div class="av">${SHOW_NAMES ? esc(initials(nm)) : '✓'}</div>
          <div class="who"><b>${esc(nm)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div><time>${fmt(m.t)}</time></li>`;
      }).join('')
    : '<li class="empty">Nessun ingresso ancora · si parte! 🏁</li>';
  if (fresh.length && SHOW_NAMES) welcome(nameOf(fresh[0].k, recs[fresh[0].k]));

  // grafico: linea del tempo continua dal primo ingresso a adesso
  const buckets = {};
  const slot = t => { const d = new Date(t); d.setMinutes(Math.floor(d.getMinutes() / 15) * 15, 0, 0); return d.getTime(); };
  entered.forEach(k => { const s = slot(recs[k].t); buckets[s] = (buckets[s] || 0) + 1; });
  const slots = Object.keys(buckets).map(Number).sort((a, b) => a - b);
  if (!slots.length) { $('#chart').innerHTML = '<p class="empty">Il grafico compare al primo ingresso.</p>'; set('#peak', ''); return; }
  const line = [];
  for (let s = slots[0]; s <= Math.max(slots[slots.length - 1], slot(Date.now())); s += 15 * 60000) line.push(s);
  const view = line.slice(-28);
  const max = Math.max(...view.map(s => buckets[s] || 0), 1);
  const peak = view.reduce((b, s) => ((buckets[s] || 0) > (buckets[b] || 0) ? s : b), view[0]);
  const hm = s => { const d = new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  $('#chart').innerHTML = view.map((s, i) => {
    const v = buckets[s] || 0;
    const label = view.length <= 14 || i % 2 === 0 || s === peak ? hm(s) : '';
    return `<div class="c"><span class="v">${v || ''}</span><div class="b${!v ? ' z' : s === peak ? ' p' : ''}" style="height:${v ? Math.max(6, Math.round(v / max * 100)) : 3}%"></div><span class="l">${label}</span></div>`;
  }).join('');
  $('#peak').innerHTML = buckets[peak] ? `Punta: <b>${hm(peak)}</b> · ${buckets[peak]} ingressi` : '';
}

let welTimer;
function welcome(name) {
  $('#welName').textContent = name;
  const w = $('#welcome'); w.classList.add('show');
  clearTimeout(welTimer); welTimer = setTimeout(() => w.classList.remove('show'), 4500);
}

setInterval(() => {
  const d = new Date();
  $('#clock').innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<small>${pad(d.getSeconds())}</small>`;
  $('#upd').textContent = lastOk ? `Aggiornato alle ${new Date(lastOk).toLocaleTimeString('it-IT')}` : 'In attesa dei dati…';
}, 1000);
setInterval(() => { if (key && document.visibilityState === 'visible') tick(); }, 3000);
$('#fs').addEventListener('click', () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d); });
let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); });
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); } });
wake();
if (key) tick(true); else showLogin();
</script>
</body>
